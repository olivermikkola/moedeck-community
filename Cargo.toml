[package]
name = "moedeck"
version = "0.1.1"
edition = "2021"
description = "MoE Deck: run Claude Code, Codex, Antigravity, OpenCode and Keel from your phone"
license = "FSL-1.1-ALv2"
repository = "https://github.com/olivermikkola/moedeck-community"
homepage = "https://github.com/olivermikkola/moedeck-community"
readme = "README.md"
keywords = ["ai", "agent", "claude-code", "opencode", "gateway"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "moedeck"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs", "signal"] }
tokio-stream = { version = "=0.1.18", features = ["sync"] }
futures-util = "=0.3.32"
hyper = { version = "=1.8.1", features = ["full"] }
hyper-util = { version = "=0.1.20", features = ["full"] }
http-body-util = "=0.1.3"
http = "=1.4.0"
bytes = "=1.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
anyhow = "=1.0.104"
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
uuid = { version = "=1.21.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.44", features = ["serde"] }
libc = "=0.2.190"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
