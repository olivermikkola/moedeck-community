name: release

# Cut a release by pushing a tag: `git tag v0.1.1 && git push origin v0.1.1`.
# Builds the release binary on Linux (x86_64, static musl, so it runs on any
# distro regardless of its glibc) and macOS (aarch64), then
# attaches tarballs + SHA-256 checksums to a GitHub Release with generated
# notes. Version metadata embedded in the binary comes from Cargo.toml;
# keep Cargo.toml version and the tag in sync when bumping.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Build and smoke-test only; publishing needs a tag.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag v${tag_version} does not match Cargo.toml version ${cargo_version}. Bump Cargo.toml (or move the tag)."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The point of the static build: it must run on an old glibc distro.
      - name: Smoke-test on Debian 11 (glibc 2.31)
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/moedeck"
          file "$bin"
          docker run --rm -v "$PWD/$bin:/moedeck:ro" debian:11 /moedeck --version

      - name: Package binary
        run: |
          set -euo pipefail
          dir="moedeck-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/${dir}"
          cp "target/${{ matrix.target }}/release/moedeck" "dist/${dir}/"
          cp README.md LICENSE.md "dist/${dir}/"
          tar -czf "dist/${dir}.tar.gz" -C dist "${dir}"
          echo "package=dist/${dir}.tar.gz" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.package }}
          if-no-files-found: error

  release:
    name: attach checksums and create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the release and push artifacts
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MoE Deck ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest \
            release/*.tar.gz release/SHA256SUMS.txt
