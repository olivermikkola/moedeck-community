name: release

# Cut a release by hand. Push the tag first (that push does not run this
# workflow), then start it from the Actions tab (release → Run workflow)
# with the tag input set, or:
#   gh workflow run release.yml -f tag=v0.1.1
# Leave the tag empty to build and smoke-test the selected ref only.
# Dispatching on the tag ref itself (`gh workflow run release.yml --ref v0.1.1`)
# also publishes. Builds the release binary on Linux (x86_64, static musl, so
# it runs on any distro regardless of its glibc) and macOS (aarch64), then
# attaches tarballs + SHA-256 checksums to a GitHub Release with generated
# notes. Version metadata embedded in the binary comes from Cargo.toml;
# keep Cargo.toml version and the tag in sync when bumping.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.1). Leave empty to build and smoke-test only."
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Tag input, or the ref itself when this run was dispatched on a tag.
      RELEASE_TAG: "${{ inputs.tag != '' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}"
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      - name: Verify tag matches Cargo.toml version
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag v${tag_version} does not match Cargo.toml version ${cargo_version}. Bump Cargo.toml (or move the tag)."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The point of the static build: it must run on an old glibc distro.
      - name: Smoke-test on Debian 11 (glibc 2.31)
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/moedeck"
          file "$bin"
          docker run --rm -v "$PWD/$bin:/moedeck:ro" debian:11 /moedeck --version

      - name: Package binary
        run: |
          set -euo pipefail
          ref_name="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          dir="moedeck-${ref_name#v}-${{ matrix.target }}"
          mkdir -p "dist/${dir}"
          cp "target/${{ matrix.target }}/release/moedeck" "dist/${dir}/"
          cp README.md LICENSE.md "dist/${dir}/"
          tar -czf "dist/${dir}.tar.gz" -C dist "${dir}"
          echo "package=dist/${dir}.tar.gz" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.package }}
          if-no-files-found: error

  release:
    name: attach checksums and create GitHub release
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the release and push artifacts
    env:
      RELEASE_TAG: "${{ inputs.tag != '' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}"
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MoE Deck ${RELEASE_TAG#v}" \
            --generate-notes \
            --latest \
            release/*.tar.gz release/SHA256SUMS.txt
